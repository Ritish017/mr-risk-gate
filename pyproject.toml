[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "riskgate"
version = "0.1.0"
description = "Deterministic, explainable merge-request risk scoring that gates GitLab Duo flows"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = []

[project.scripts]
riskgate = "riskgate.cli:main"

[tool.setuptools]
packages = ["riskgate", "tinyledger"]

[tool.pytest.ini_options]
testpaths = ["tests"]
